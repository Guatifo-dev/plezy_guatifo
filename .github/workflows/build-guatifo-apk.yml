name: Build Plezy Guatifo APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/plex-trailer-preview
      - feature/plezy-vision-icon-183
      - test-firetv-home-banner
      - test-firetv-explicit-launcher-icon
      - test-plezyvision-centered-logo-banner
      - plezyvision-hide-original-updates
      - fix/discover-catalog-live-refresh
      - fix/trailer-audio-on-navigation
      - feature/dynamic-ambient-background
      - stable/ambient-8aad4a8
      - fix/movie-details-four-improvements-2fa806d
      - feature/movie-detail-slide-return-focus-7f59d4c
      - feature/movie-navigation-all-rails-3161dd1
      - feature/detail-navigation-polish-464b398
      - fix/vision-series-full-fanart-trailer-insets-24d6fc9
      - feature/series-discover-identical-backdrop-138c490
      - feature/movie-discover-shared-spotlight-ffa4d8f

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android ARM32 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Generate localized strings
        run: dart run slang

      - name: Configure persistent release signing
        env:
          PLEZY_KEYSTORE_BASE64: ${{ secrets.PLEZY_KEYSTORE_BASE64 }}
          PLEZY_KEYSTORE_PASSWORD: ${{ secrets.PLEZY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PLEZY_KEYSTORE_BASE64" || { echo "::error::Missing PLEZY_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$PLEZY_KEYSTORE_PASSWORD" || { echo "::error::Missing PLEZY_KEYSTORE_PASSWORD secret"; exit 1; }
          umask 077
          printf '%s' "$PLEZY_KEYSTORE_BASE64" | base64 --decode > android/app/plezy-guatifo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$PLEZY_KEYSTORE_PASSWORD
          keyPassword=$PLEZY_KEYSTORE_PASSWORD
          keyAlias=plezy-guatifo
          storeFile=plezy-guatifo-release.jks
          EOF

      - name: Generate centered PlezyVision banner and transparent launcher icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path

          root = Path("android/app/src/main/res")
          source = Image.open(root / "mipmap-xxxhdpi/ic_launcher.png").convert("RGBA")
          # The source contains a rounded black/navy square, not a flat dark background.
          # Identify the yellow/orange triangle by its warm color, then reconstruct
          # its silhouette row-by-row. This fills over the black filmstrip cutouts
          # WITHOUT removing the black filmstrip pixels inside the triangle.
          w, h = source.size
          p = source.load()
          rows = {}
          for y in range(h):
              xs = []
              for x in range(w):
                  r,g,b,a = p[x,y]
                  if a > 0 and r > 130 and g > 45 and r > g*1.22 and g > b*1.22:
                      xs.append(x)
              if len(xs) >= 2:
                  rows[y] = (min(xs), max(xs))
          if len(rows) < h//4:
              raise RuntimeError("Unable to identify the warm-colored triangle silhouette")
          mask = Image.new("L",(w,h),0)
          draw = ImageDraw.Draw(mask)
          ys = sorted(rows)
          for y in range(ys[0],ys[-1]+1):
              if y in rows:
                  left,right = rows[y]
              else:
                  prev = max(k for k in ys if k < y)
                  nex = min(k for k in ys if k > y)
                  t = (y-prev)/(nex-prev)
                  left = round(rows[prev][0]*(1-t)+rows[nex][0]*t)
                  right = round(rows[prev][1]*(1-t)+rows[nex][1]*t)
              draw.line((left,y,right,y),fill=255)
          # Smooth only the alpha edge; the original orange/black artwork remains.
          mask = mask.filter(ImageFilter.GaussianBlur(0.7))
          source.putalpha(mask)
          bbox = mask.getbbox()
          if not bbox:
              raise RuntimeError("Empty triangle mask")
          symbol = source.crop(bbox)
          # Guard against accidentally shipping a dark rectangular background.
          if symbol.getpixel((0,0))[3] > 10 or symbol.getpixel((symbol.width-1,0))[3] > 10:
              raise RuntimeError("Triangle extraction still has opaque square corners")
          # Fit the triangle to 96% of the square, centered with minimal transparent margins.
          for density, size in (("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)):
              canvas = Image.new("RGBA",(size,size),(0,0,0,0))
              scale = min((size*0.96)/symbol.width,(size*0.96)/symbol.height)
              art = symbol.resize((max(1,round(symbol.width*scale)),max(1,round(symbol.height*scale))),Image.Resampling.LANCZOS)
              canvas.alpha_composite(art,((size-art.width)//2,(size-art.height)//2))
              canvas.save(root / f"mipmap-{density}/ic_launcher.png")
          # Use the EXACT generated transparent launcher icon for Projectivy banners.
          # Do not re-extract, redraw, recolor or alter the icon artwork.
          launcher = Image.open(root / "mipmap-xxxhdpi/ic_launcher.png").convert("RGBA")
          launcher_bbox = launcher.getchannel("A").getbbox()
          if not launcher_bbox:
              raise RuntimeError("Transparent launcher icon is empty")
          banner_symbol = launcher.crop(launcher_bbox)
          for density, dims in (("xhdpi",(320,180)),("xxhdpi",(480,270)),("xxxhdpi",(640,360))):
              bw,bh=dims
              canvas=Image.new("RGBA",dims,(15,20,32,255))
              scale=min(bw*0.96/banner_symbol.width,bh*0.96/banner_symbol.height)
              art=banner_symbol.resize((max(1,round(banner_symbol.width*scale)),max(1,round(banner_symbol.height*scale))),Image.Resampling.LANCZOS)
              canvas.alpha_composite(art,((bw-art.width)//2,(bh-art.height)//2))
              canvas.convert("RGB").save(root / f"drawable-{density}/tv_banner.png")
          # Reuse the approved launcher artwork in the Flutter About screen.
          # The icon is generated before flutter build; no new artwork is introduced.
          launcher.save(Path("assets/plezyvision_about.png"))
          print("Generated 5 transparent launcher icons and 3 centered 16:9 banners")
          PY

      - name: Build release APK (persistent signing)
        env:
          GUA_ARM32: "1"
        run: flutter build apk --release --target-platform android-arm --build-number="$((160 + GITHUB_RUN_NUMBER))" --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Publish APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezy-guatifo-android-arm32
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish PlezyVision v1.0.1 release
        if: ${{ github.ref == 'refs/heads/fix/discover-catalog-live-refresh' && contains(github.event.head_commit.message, '[publish-v1.0.1]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.1 build/app/outputs/flutter-apk/app-release.apk#PlezyVision.apk \
            --target "$GITHUB_SHA" \
            --title "PlezyVision 1.0.1" \
            --notes "### Mejoras
          - **Todas mis Películas** y **Todas mis Series** actualizan su contenido cuando se producen cambios en las bibliotecas del servidor Plex.
          - Las películas y series eliminadas dejan de aparecer en esos apartados y se incorporan las nuevas sin tener que reiniciar la aplicación.
          - Actualización al regresar a la aplicación y al refrescar manualmente.

          Actualización instalable sobre PlezyVision 1.0 sin perder los ajustes. APK para Fire TV ARM32."

      - name: Publish PlezyVision v1.0.2 release
        if: ${{ github.ref == 'refs/heads/fix/trailer-audio-on-navigation' && contains(github.event.head_commit.message, '[publish-v1.0.2]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.2 build/app/outputs/flutter-apk/app-release.apk#PlezyVision.apk \
            --target "$GITHUB_SHA" \
            --title "PlezyVision 1.0.2" \
            --notes-file docs/PLEZYVISION-1.0.2.md
